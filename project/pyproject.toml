[project]
name = "a-new-agent-loop"
version = "0.1.0"
description = "Professional Agent Loop with local models (embedding/vision/stt/tts) and tool-discovery via embedding search"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "A New Agent Loop" }]
dependencies = [
    "huggingface_hub>=0.25",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    "onnxruntime>=1.18",
    "safetensors>=0.4",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
stt-ct2 = ["ctranslate2>=4.0", "faster-whisper>=1.0"]
tts = ["supertonic>=1.3"]
all = ["ctranslate2>=4.0", "faster-whisper>=1.0", "supertonic>=1.3", "torch>=2.2", "accelerate>=0.30"]

[project.scripts]
setup-models = "scripts.setup_models:main"
doctor = "scripts.doctor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "models*", "scripts*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
