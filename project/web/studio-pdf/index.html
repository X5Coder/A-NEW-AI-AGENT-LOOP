<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='black'/%3E%3Crect%20x='17'%20y='17'%20width='30'%20height='30'%20rx='7'%20fill='white'/%3E%3C/svg%3E" />
  <title>PDF Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Non-blocking: an offline/DNS failure falls back to system fonts
       silently and never delays or breaks the first paint. -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" crossorigin="anonymous" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" /></noscript>
  <!-- First-paint cover (inline so it paints before the 2.8MB bundle even
       parses): dark studio look from byte zero, never a white sheet. React
       replaces this static placeholder on boot. -->
  <style>html,body{margin:0;padding:0;height:100%;background:#1a1a1a}#root{min-height:100%;background:#1a1a1a}.first-paint{height:100dvh;display:flex;flex-direction:column;background:#1a1a1a}.first-bar{height:44px;min-height:44px;background:#000}.first-canvas{flex:1;background:#1a1a1a}</style>
</head>
<body>
  <div id="root"><div class="first-paint" aria-hidden="true"><div class="first-bar"></div><div class="first-canvas"></div></div></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
